name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  test:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Pinned deliberately. The action SHA is pinned but its default
      # toolchain is "stable", which floats: between May and September 2026
      # new clippy lints turned master red with no repository change. Bump
      # this in its own pull request so the lint delta is reviewable.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.98.0"
          # An explicit version installs the minimal profile, unlike the
          # action's "stable" default, so ask for the components by name.
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Pinned deliberately. The action SHA is pinned but its default
      # toolchain is "stable", which floats: between May and September 2026
      # new clippy lints turned master red with no repository change. Bump
      # this in its own pull request so the lint delta is reviewable.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.98.0"
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit
        run: cargo audit --file Cargo.lock

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          artifact="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${artifact}" -o "${tmp}/${artifact}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "${tmp}/checksums.txt"
          (cd "$tmp" && grep "  ${artifact}$" checksums.txt | sha256sum -c -)
          tar -xzf "${tmp}/${artifact}" -C "$tmp" gitleaks
          sudo install -m 0755 "${tmp}/gitleaks" /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
