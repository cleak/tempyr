[workspace]
resolver = "3"
members = [
    "crates/tempyr-core",
    "crates/tempyr-index",
    "crates/tempyr-interview",
    "crates/tempyr-render",
    "crates/tempyr-linear",
    "crates/tempyr-cli",
    "crates/tempyr-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
walkdir = "2"
thiserror = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
fastembed = "5"
tempfile = "3"
rand = "0.9"
schemars = "1"
rmcp = { version = "1.3", features = ["transport-io"] }
dotenvy = "0.15"
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
